# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: elsueno-cslt
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: elsueno_cslt
      - key: DB_SSL
        value: "true"
      - key: ADMIN_PASSWORD
        sync: false
